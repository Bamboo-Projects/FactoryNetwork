<!doctype html>
<meta charset="utf-8">
<title>Web-Tafel</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0f16; color: #dfe3ee;
               font: 16px/1.5 "Segoe UI", system-ui, sans-serif; }
  body { display: grid; place-content: center; text-align: center; gap: 14px; }
  h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: .01em; }
  p { margin: 0; color: #8b93a7; }
  .takt { font-variant-numeric: tabular-nums; font-size: 44px; color: #7dd3a0; }
  .hinweis { font-size: 13px; color: #5d6478; }
</style>
<h1>Web-Tafel</h1>
<p>Diese Seite läuft in der Welt, nicht in einem Fenster.</p>
<div class="takt" id="takt">0</div>
<p class="hinweis">Bilder seit dem Öffnen — steht die Zahl, steht der Browser.</p>
<script>
  let n = 0;
  const feld = document.getElementById('takt');
  function malen() {
    feld.textContent = ++n;
    requestAnimationFrame(malen);
  }
  requestAnimationFrame(malen);
</script>
