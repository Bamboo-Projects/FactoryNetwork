<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Messfläche</title>
<link rel="stylesheet" href="vs/editor/editor.main.css">
<style>
  /* Der Minecraft-Hintergrund, wie in der richtigen Oberfläche. */
  #bg { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0 }
  #bg:not([src]) { display:none }

  /* Dieselbe Kopie, einmal weichgezeichnet. Ein filter — anders als ein
     backdrop-filter — wird von Chromium zwischengespeichert, solange sich das
     Element nicht ändert. Bei einem stehenden Hintergrund muss er also genau
     einmal gerechnet werden statt bei jedem Neuzeichnen. */
  #bgblur { position:fixed; inset:0; width:100%; height:100%; object-fit:cover;
            z-index:0; filter:blur(18px) saturate(140%); display:none }
  body.vorblur #bgblur { display:block; clip-path:inset(0) }

  * { box-sizing:border-box }
  html,body { margin:0; height:100%; overflow:hidden; background:#0a0b10;
              color:#dfe3ee; font:13px/1.5 "Segoe UI",system-ui,sans-serif }

  #wrap { position:relative; z-index:1; height:100% }

  /* Nackte Varianten: die Fläche ganz ausfüllen, nichts drumherum. */
  #plain { width:100%; height:100%; margin:0; padding:16px; border:0;
           background:#12121c; color:#dfe3ee; resize:none; outline:none;
           font:14px/1.5 Consolas,monospace }

  /* Die volle Oberfläche, wie in Schritt F und G. */
  body.shell #wrap { display:grid; grid-template-rows:34px 1fr 190px 24px }
  #tabs,#explorer,#panel,#status { background:rgba(18,18,26,0.62) }
  body.glas #tabs, body.glas #explorer,
  body.glas #panel, body.glas #status { backdrop-filter:blur(20px) saturate(130%) }
  #tabs { display:flex; align-items:center; padding:0 16px; gap:16px;
          border-bottom:1px solid rgba(255,255,255,0.10) }
  #mid { display:grid; grid-template-columns:220px 1fr; min-height:0; height:100% }
  /* Ohne die Hülle füllt der Editor die Fläche allein. Fehlt diese Regel,
     bekommt er die Höhe null — er lädt, zeigt aber nichts, nimmt keinen Fokus
     an, und die Messung liefert siebenundzwanzig Bilder statt sechshundert.
     Genau so ist die Variante „Monaco minimal" zweimal ausgefallen. */
  body:not(.shell) #mid { grid-template-columns:1fr }
  body:not(.shell) #editor { position:fixed; inset:0; z-index:1 }
  #explorer { border-right:1px solid rgba(255,255,255,0.10); padding:12px 14px }
  #editor { min-width:0; min-height:0 }
  #panel { border-top:1px solid rgba(255,255,255,0.10); padding:10px 14px;
           font:12px Consolas,monospace; color:#9aa1b4 }
  #status { display:flex; align-items:center; padding:0 14px;
            background:rgba(125,211,160,0.16);
            border-top:1px solid rgba(255,255,255,0.10) }
  .weg { display:none }
</style>
</head>
<body>
<img id="bg" alt=""><img id="bgblur" alt="">
<div id="wrap">
  <div id="tabs" class="weg">main.fn · sortierung.fn · ofen.fn</div>
  <div id="mid">
    <div id="explorer" class="weg">Projekt<br>main.fn<br>lager.fn<br>netz.fn</div>
    <div id="editor"></div>
  </div>
  <div id="panel" class="weg">Keine Probleme gefunden.</div>
  <div id="status" class="weg">Ln 1, Col 1</div>
</div>
<textarea id="plain" class="weg" spellcheck="false"></textarea>
<div id="plainedit" class="weg" contenteditable="true"></div>
<canvas id="leinwand" class="weg"></canvas>

<script src="vs/loader.js"></script>
<script>
(function () {
  'use strict';

  var bg = document.getElementById('bg');
  var bgblur = document.getElementById('bgblur');
  window.fnSetBackground = function (url) { bg.src = url; bgblur.src = url; };

  /* ---------------------------------------------------------------
     Die Messung. Alles innerhalb der Seite, mit einer Uhr — es
     braucht keine gemeinsame Zeitbasis mit Java, weil nur Abstände
     zählen.
     --------------------------------------------------------------- */
  function Reihe() { this.werte = []; }
  Reihe.prototype.dazu = function (wert) { this.werte.push(wert); };
  Reihe.prototype.leeren = function () { this.werte = []; };
  Reihe.prototype.teil = function (anteil) {
    if (!this.werte.length) { return 0; }
    var s = this.werte.slice().sort(function (a, b) { return a - b; });
    var i = Math.min(s.length - 1, Math.max(0, Math.ceil(anteil * s.length) - 1));
    return s[i];
  };
  Reihe.prototype.zeile = function () {
    return this.werte.length
      ? this.teil(0.5).toFixed(1) + ' / ' + this.teil(0.95).toFixed(1)
        + ' / ' + this.teil(1).toFixed(1)
      : '—';
  };

  var bisInhalt = new Reihe();   // keydown → Inhalt geändert
  var bisRaf1   = new Reihe();   // keydown → erster Bildaufruf
  var bisRaf2   = new Reihe();   // keydown → zweiter, nach dem Übergeben
  var offen = null;              // Zeitpunkt des letzten keydown

  function anschlag() {
    // Nur der erste Anschlag einer Folge zählt — wie auf der Java-Seite.
    if (offen !== null) { return; }
    offen = performance.now();
    var start = offen;
    requestAnimationFrame(function () {
      bisRaf1.dazu(performance.now() - start);
      // <b>Der zweite Aufruf ist der wichtige.</b> Der erste läuft noch
      // vor Layout und Zeichnen; erst der zweite liegt hinter dem
      // Übergeben des vorigen Bildes. Wer nur den ersten misst, misst
      // den Ereignisweg und hält ihn für die Renderzeit.
      requestAnimationFrame(function () {
        bisRaf2.dazu(performance.now() - start);
        offen = null;
      });
    });
  }

  function inhaltGeaendert() {
    if (offen !== null) { bisInhalt.dazu(performance.now() - offen); }
  }

  window.fnProbe = {
    bericht: function (name) {
      console.log('PROBE ' + (name || '?')
        + ' | keydown→Inhalt ' + bisInhalt.zeile()
        + ' | keydown→rAF1 ' + bisRaf1.zeile()
        + ' | keydown→rAF2 ' + bisRaf2.zeile()
        + ' | n=' + bisRaf2.werte.length
        + ' | aktiv=' + (document.activeElement && document.activeElement.tagName));
    },
    // Dieselben Zahlen als Wert statt als Konsolenzeile. Die Konsole eines
    // fremden Browsers liegt woanders als das Skript, das ihn steuert; wer
    // von außen misst, braucht eine Antwort und keinen Eintrag im Protokoll.
    zahlen: function () {
      return {
        inhalt: [bisInhalt.teil(0.5), bisInhalt.teil(0.95)],
        raf1: [bisRaf1.teil(0.5), bisRaf1.teil(0.95)],
        raf2: [bisRaf2.teil(0.5), bisRaf2.teil(0.95), bisRaf2.teil(1)],
        n: bisRaf2.werte.length,
        alle: bisRaf2.werte
      };
    },
    leeren: function () {
      bisInhalt.leeren(); bisRaf1.leeren(); bisRaf2.leeren(); offen = null;
    },
    fokus: function () {
      // Monaco zuerst: Sein verstecktes Eingabefeld ist selbst ein textarea,
      // und wer blind das erste textarea nimmt, trifft im Zweifel das falsche.
      if (window.fnEditor) { window.fnEditor.focus(); }
      else {
        var ziel = document.querySelector('#plain:not(.weg)')
          || document.querySelector('#plainedit:not(.weg)');
        if (ziel) { ziel.focus(); }
      }
      console.log('PROBE fokus auf ' + (document.activeElement
        && document.activeElement.tagName));
    },
    frisch: function () {
      if (window.fnEditor) { window.fnEditor.getModel().setValue(inhalt(120)); }
      var t = document.getElementById('plain');
      if (t) { t.value = ''; }
      var c = document.getElementById('plainedit');
      if (c) { c.textContent = ''; }
      this.leeren();
    }
  };

  /* ---------------------------------------------------------------
     Inhalt, gleich für alle Varianten
     --------------------------------------------------------------- */
  var WORT = ['worker','storage','move','when','power','display','emit',
              'const','let','if','else','every','ticks','from','to','at'];
  function inhalt(zeilen) {
    var aus = [];
    for (var i = 0; i < zeilen; i++) {
      aus.push('    ' + WORT[i % WORT.length] + ' ' + WORT[(i * 3) % WORT.length]
        + ' = "' + WORT[(i * 7) % WORT.length] + '" // Zeile ' + (i + 1));
    }
    return aus.join('\n');
  }

  /* ---------------------------------------------------------------
     Aufbau je Variante
     --------------------------------------------------------------- */
  var v = (location.href.match(/[?&]v=([a-z\-]+)/) || [])[1] || 'monaco-glas';
  var body = document.body;

  function zeige(id) { document.getElementById(id).classList.remove('weg'); }

  if (v === 'takt') {
    // <b>Eine Seite, die nichts tut außer sich zu ändern.</b> Sie misst
    // keine Latenz, sondern den Takt: Wie oft kommt ein fensterloser Browser
    // überhaupt dazu, ein Bild abzuliefern? Dafür muss sich in jedem Bild
    // etwas ändern — ein Browser, bei dem alles bleibt, wie es war, malt
    // gar nicht und sähe unendlich langsam aus.
    //
    // <b>Und nur ein kleines Feld.</b> Die ganze Fläche zu ändern würde den
    // Takt mit der Übertragungszeit vermischen; vierzig mal vierzig Punkte
    // kosten nichts und genügen, damit Chromium ein Bild für nötig hält.
    var feld = document.getElementById('leinwand');
    feld.classList.remove('weg');
    feld.style.cssText = 'position:fixed;left:0;top:0;z-index:2';
    feld.width = 40;
    feld.height = 40;
    var pinsel = feld.getContext('2d');
    var runde = 0;
    (function male() {
      pinsel.fillStyle = (runde++ % 2) ? '#6ee7a8' : '#2a2a3c';
      pinsel.fillRect(0, 0, 40, 40);
      requestAnimationFrame(male);
    })();
    console.log('PROBE bereit: takt');
  } else if (v === 'leinwand') {
    // <b>Der Kontrollfall.</b> Weniger Arbeit als hier kann eine Seite auf
    // einen Tastendruck nicht leisten: kein Layout, kein Textsatz, keine
    // Bildlaufrechnung, kein Neuaufbau einer Zeile — ein gefülltes Rechteck
    // von zwanzig mal zwanzig Bildpunkten, und nichts sonst.
    //
    // <b>Warum das die eigentliche Frage entscheidet.</b> Bleibt die Strecke
    // vom Tastendruck bis zum fertigen Bild hier genauso lang wie unter
    // Monaco, dann misst sie überhaupt keine Arbeit. Dann misst sie
    // Wartezeit, und keine Zeile Monaco-Optimierung könnte je etwas daran
    // ändern. Wird sie hier deutlich kürzer, ist die Zeit tatsächlich in der
    // Seite verbraucht worden und Monaco ist ein lohnendes Ziel.
    var leinwand = document.getElementById('leinwand');
    leinwand.classList.remove('weg');
    leinwand.style.cssText = 'position:fixed;inset:0;z-index:2';
    leinwand.width = window.innerWidth;
    leinwand.height = window.innerHeight;
    var stift = leinwand.getContext('2d');
    stift.fillStyle = '#12121c';
    stift.fillRect(0, 0, leinwand.width, leinwand.height);
    var kachel = 0;
    // Am Fenster horchen, nicht am Element: Eine Leinwand nimmt von sich aus
    // keinen Fokus an, und ein tabindex hier wäre eine zweite Sache, die
    // schiefgehen kann.
    window.addEventListener('keydown', function () {
      anschlag();
      var x = (kachel % 40) * 24 + 20;
      var y = (Math.floor(kachel / 40) % 20) * 24 + 20;
      kachel++;
      stift.fillStyle = (kachel % 2) ? '#6ee7a8' : '#2a2a3c';
      stift.fillRect(x, y, 20, 20);
      inhaltGeaendert();
    });
    console.log('PROBE bereit: leinwand');
  } else if (v === 'huelle') {
    // Nur die Oberfläche, ohne Editor — die Speicherstufe zwischen leerem
    // Browser und geladenem Monaco.
    body.classList.add('shell');
    ['tabs','explorer','panel','status'].forEach(function (id) { zeige(id); });
    console.log('PROBE bereit: huelle');
  } else if (v === 'textarea' || v === 'contenteditable') {
    // Keine Umbenennung mehr: Beim ersten Versuch bekamen zwei Elemente
    // dieselbe Kennung, die Fokussuche fand das falsche, und die Variante
    // tippte fünfundvierzig Sekunden ins Leere.
    var feld = document.getElementById(v === 'textarea' ? 'plain' : 'plainedit');
    feld.classList.remove('weg');
    feld.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;'
      + 'margin:0;padding:16px;border:0;background:#12121c;color:#dfe3ee;'
      + 'outline:none;overflow:auto;white-space:pre;'
      + 'font:14px/1.5 Consolas,monospace;z-index:2';
    feld.addEventListener('keydown', anschlag);
    feld.addEventListener('input', inhaltGeaendert);
    feld.focus();
    console.log('PROBE bereit: ' + v);
  } else {
    require.config({ paths: { vs: 'vs' } });
    require(['vs/editor/editor.main'], function () {
      var m = window.monaco;
      m.languages.register({ id: 'manifold' });
      m.languages.setMonarchTokensProvider('manifold', {
        keywords: WORT,
        tokenizer: { root: [
          [/\/\/.*$/, 'comment'],
          [/"([^"\\]|\\.)*"/, 'string'],
          [/\b\d+\b/, 'number'],
          [/[a-zA-Z_]\w*/, { cases: { '@keywords':'keyword', '@default':'identifier' } }]
        ] }
      });
      m.editor.defineTheme('fn-dunkel', {
        base:'vs-dark', inherit:true, rules:[],
        colors:{ 'editor.background':'#12121c' }
      });
      m.editor.defineTheme('fn-glas', {
        base:'vs-dark', inherit:true, rules:[],
        colors:{ 'editor.background':'#12121ca0', 'minimap.background':'#00000040' }
      });

      var minimal = v === 'monaco-min';
      if (!minimal) { body.classList.add('shell'); ['tabs','explorer','panel','status']
        .forEach(function (id) { zeige(id); }); }
      if (v === 'monaco-glas' || v === 'monaco-vorblur') { body.classList.add('glas'); }
      if (v === 'monaco-vorblur') {
        body.classList.remove('glas');      // kein backdrop-filter
        body.classList.add('vorblur');      // stattdessen die geblurte Kopie
      }

      var editor = m.editor.create(document.getElementById('editor'), {
        value: inhalt(120),
        language: 'manifold',
        theme: minimal ? 'fn-dunkel'
          : (v === 'monaco-full' ? 'fn-dunkel' : 'fn-glas'),
        automaticLayout: true,
        fontSize: 14,
        fontFamily: 'Consolas, monospace',
        // Für „minimal" alles ab, was eine eigene Fläche zeichnet.
        minimap: { enabled: !minimal },
        stickyScroll: { enabled: !minimal },
        folding: !minimal,
        lineNumbers: minimal ? 'off' : 'on',
        glyphMargin: !minimal,
        overviewRulerLanes: minimal ? 0 : 3,
        overviewRulerBorder: !minimal,
        renderLineHighlight: minimal ? 'none' : 'line',
        occurrencesHighlight: minimal ? 'off' : 'singleFile',
        selectionHighlight: !minimal,
        bracketPairColorization: { enabled: !minimal },
        guides: { indentation: !minimal, bracketPairs: !minimal },
        scrollbar: { verticalScrollbarSize: minimal ? 0 : 14 },
        renderWhitespace: 'none',
        smoothScrolling: false
      });
      window.fnEditor = editor;

      editor.onKeyDown(anschlag);
      editor.getModel().onDidChangeContent(inhaltGeaendert);
      editor.focus();
      console.log('PROBE bereit: ' + v);
    });
  }
})();
</script>
</body>
</html>
