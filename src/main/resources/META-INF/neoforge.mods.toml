modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Macht eine Fabrik zu einem programmierbaren System. Maschinen bekommen einen
Connector und damit einen Namen; die gesamte Logistik wird in Manifold
geschrieben, einer Sprache, die für Fabriken gemacht ist.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
# BambooCEF is the CEF web runtime behind the editor, the overlays and the
# world surfaces. Client only: the library has no server side, and a server
# running FactoryNetwork must not be asked for it.
modId = "bamboocef"
type = "required"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "CLIENT"

# Jade zeigt an, was man ansieht — bei uns die Kanalbelegung eines Kabels.
# Freiwillig: Ohne Jade fehlt nur die Anzeige, nichts sonst.
[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[15.0.0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
# JEI zeigt die Rezepte der Presse. Freiwillig: Ohne JEI fehlt nur die
# Anzeige — die Presse arbeitet genauso, man fände ihre Rezepte nur nicht.
modId = "jei"
type = "optional"
versionRange = "[19.0.0,)"
ordering = "AFTER"
side = "CLIENT"

# Mekanism trägt die Chemikalien. Freiwillig: Ohne Mekanism gibt es
# chemical: nicht, und die Meldung sagt genau das — alles andere läuft
# unverändert weiter.
[[dependencies.${mod_id}]]
modId = "mekanism"
type = "optional"
versionRange = "[10.7.0,)"
ordering = "AFTER"
side = "BOTH"
