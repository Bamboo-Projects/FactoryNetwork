plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // Debugger-Anschluss für HotSwap: Wer auf Port 5005 verbindet,
            // kann Methodenkörper im laufenden Spiel austauschen, ohne neu zu
            // starten. suspend=n heißt, das Spiel wartet nicht darauf.
            jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        // Führt die GameTests aus und beendet sich danach mit dem Ergebnis
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

/**
 * Schiebt geänderte Texturen, Modelle und Sprachdateien ins laufende Spiel.
 *
 * Danach im Spiel F3+T drücken — Minecraft lädt die Ressourcen neu, ohne dass
 * jemand das Fenster schließen muss. Für Java-Code reicht das nicht; dafür
 * gibt es den Debugger-Anschluss auf Port 5005.
 */
tasks.register('syncResources') {
    group = 'factorynetwork'
    description = 'Ressourcen ins laufende Spiel schieben, dann im Spiel F3+T'
    dependsOn 'processResources'
    doLast {
        println 'Ressourcen aktualisiert — jetzt im Spiel F3+T druecken.'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    def expandProps = [
            mod_id     : mod_id,
            mod_name   : mod_name,
            mod_version: mod_version,
            mod_license: mod_license,
            mod_authors: mod_authors,
            neo_version: neo_version,
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
}
