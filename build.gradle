plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

// <b>Chromium kommt aus dem eigenen Bau, nicht mehr von MCEF.</b> Bis zur
// bestandenen Handprüfung am 1. September 2026 lagen beide Wege nebeneinander
// und ein Schalter entschied. Er ist weg: Was er einschaltete, ist jetzt der
// einzige Weg.
//
// Nebeneinander konnten sie ohnehin nie stehen — MCEF und upstream java-cef
// bringen beide das vollständige Paket org.cef mit, 170 Klassen, gleiche
// Namen, anderer Inhalt. Deshalb war es ein Schalter vor dem Compiler und
// keine Verzweigung darin.
//
// Die Laufzeitumgebung entsteht mit
//   pwsh -File tools/runtime/build-jcef.ps1
// und ist ab hier Voraussetzung für jeden Bau. Ohne sie bricht Gradle mit
// einer Ansage ab, statt den Fehler in den Compiler zu tragen.
def ownRuntimeDir = file('tools/runtime/build/out/windows-x86_64')

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // Wo die eigene Laufzeitumgebung liegt.
            systemProperty 'fn.runtime.dir', ownRuntimeDir.absolutePath
            // <b>Kein PATH-Eintrag mehr.</b> Hier stand einer, weil java-cef
            // seine Bibliotheken über java.library.path suchte und der sich
            // auf Windows aus dem PATH speist. Das trug nur im Entwicklungs-
            // lauf — ein Launcher setzt keinen PATH für uns. Seit Patch 0005
            // nennt die Mod den Ordner selbst über jcef.library.path, und
            // dieser Lauf prüft damit denselben Weg, den ein Spieler geht.
            // Ohne das wirft die JVM wiederholte Ausnahmen an derselben
            // Stelle irgendwann ohne Stapel — und eine Ausnahme aus einem
            // Chromium-Rückruf kommt ohnehin nur als Kopfzeile an. Beides
            // zusammen ergibt ein „Exception in thread" ohne jeden Hinweis.
            jvmArgument '-XX:-OmitStackTraceInFastThrow'
            // Die Spur um die Browsererzeugung, nur auf Ansage:
            //   ./gradlew runClient -Ptrace
            if (project.hasProperty('trace')) {
                systemProperty 'fn.cef.trace', 'true'
            }
            // Nur zur Fehlersuche, und nur auf Ansage:
            //   ./gradlew runClient -Pjnicheck
            // Die JVM prüft dann jeden Übergang nach C und zurück. Sie
            // wird davon deutlich langsamer — für eine Messung taugt der
            // Lauf nicht, für die Frage „wer wirft da eigentlich" schon.
            if (project.hasProperty('jnicheck')) {
                jvmArgument '-Xcheck:jni'
            }
            // Debugger-Anschluss für HotSwap, nur auf Anforderung:
            //   ./gradlew runClient -Pdebug
            //
            // Nicht dauerhaft an, weil ein hängengebliebener Prozess den Port
            // belegt und der nächste Start dann gar nicht erst hochkommt —
            // das ist ein schlechter Tausch für eine Möglichkeit, die man
            // selten braucht.
            if (project.hasProperty('debug')) {
                jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'
            }
            // Die Messung des Bildwegs, ebenfalls nur auf Anforderung:
            //   ./gradlew runClient -Pbenchmark
            //
            // Sie öffnet nacheinander drei Browser und schreibt Zahlen ins
            // Protokoll. Dauerhaft an wäre sie ein Kostenposten in jeder
            // Sitzung statt eines Nachweises, den man abrufen kann.
            // Nur die Entwicklungsumgebung, ohne die Nachweiskette davor:
            //   ./gradlew runClient -Pide
            // Fenstergroesse fuer die Messung:
            //   ./gradlew runClient -Pide -Pw=1920 -Ph=1080
            // Minecraft nimmt die Groesse selbst entgegen; ein echtes Fenster
            // ist der einzige Weg, eine Aufloesung wirklich zu messen statt
            // sie hochzurechnen.
            if (project.hasProperty('w') && project.hasProperty('h')) {
                programArgument '--width'
                programArgument w.toString()
                programArgument '--height'
                programArgument h.toString()
            }
            if (project.hasProperty('ide')) {
                systemProperty 'fn.ide', 'true'
                // Mit -Pidebench laeuft statt der Oberflaeche die Messung.
                if (project.hasProperty('idebench')) {
                    systemProperty 'fn.idebench', 'true'
                }
                // Nur die Tippmessung, mit langen Abschnitten:
                //   ./gradlew runClient -Pide -Ptyping -Pw=1920 -Ph=1080
                if (project.hasProperty('typing')) {
                    systemProperty 'fn.typing', 'true'
                }
                // Die Zerlegung von A ueber Vergleichsseiten:
                //   ./gradlew runClient -Pide -Pprobe -Pw=1920 -Ph=1080
                if (project.hasProperty('probe')) {
                    systemProperty 'fn.probe', 'true'
                }
                // Chromiums Fernwartung auf 127.0.0.1:9222, nur fuer Messungen:
                //   ./gradlew runClient -Pide -Pdevtools
                if (project.hasProperty('devtools')) {
                    systemProperty 'fn.devtools', 'true'
                }
                // Oberflaeche mehrfach oeffnen und schliessen, um zu sehen, ob
                // Chromium seine Prozesse wieder abraeumt:
                //   ./gradlew runClient -Pide -Plifecycle
                if (project.hasProperty('lifecycle')) {
                    systemProperty 'fn.lifecycle', 'true'
                }
                programArgument '--quickPlaySingleplayer'
                programArgument(project.hasProperty('world') ? world : 'New World')
            }
            if (project.hasProperty('benchmark')) {
                systemProperty 'fn.benchmark', 'true'
                // Direkt in eine Welt: Im Hauptmenü deckelt Minecraft die
                // Bildrate auf sechzig, und die Bildzeit misst dann die
                // Deckelung statt der Kosten.
                programArgument '--quickPlaySingleplayer'
                programArgument(project.hasProperty('world') ? world : 'New World')
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        // Führt die GameTests aus und beendet sich danach mit dem Ergebnis
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Die Unit-Tests brauchen dieselben Minecraft-Klassen wie der Hauptcode.
    // Ohne das fehlt dem Testquellsatz die Client-Seite, und ein Test für
    // den Editor ließe sich gar nicht erst übersetzen.
    addModdingDependenciesTo sourceSets.test
}

repositories {
    mavenCentral()
    // Jade wird über Modrinth bezogen; ein eigenes Maven hat es nicht.
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // JEI liegt bei BlameJared und nicht auf Modrinth-Maven. Die API ist
    // ein eigenes Artefakt — zum Übersetzen reicht sie, und sie zieht nicht
    // die halbe Mod in den Klassenpfad.
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    // Mekanism hat ein eigenes Maven. Der :api-Klassifikator trägt nur die
    // Schnittstellen — mehr braucht das Übersetzen nicht.
    exclusiveContent {
        forRepository { maven { url = 'https://modmaven.dev/' } }
        filter { includeGroup 'mekanism' }
    }
}

// <b>Was ausgeliefert wird, muss die Mod wissen.</b> tools/runtime/dist.properties
// trägt Fassung, Archivname und Prüfsumme; geschrieben wird sie beim
// Paketieren, gelesen zur Laufzeit. Als Ressource im Jar und nicht als Kopie
// im Quellbaum: So gibt es sie genau einmal.
processResources {
    from('tools/runtime/dist.properties') {
        rename { 'fn-runtime.properties' }
    }
}

// Was org.cef berührt, steht hier und nirgends sonst: fünf Klassen gegen
// upstream java-cef. Alles andere liegt in src/main/java und weiß von keiner
// Chromium-Fassung. Die Trennung stammt aus der Zeit, als es zwei Wege gab —
// sie bleibt, weil sie diese Grenze sichtbar hält.
sourceSets.main.java.srcDir('src/runtime/java')

// <b>Der Laufklassenpfad ist ein eigener.</b> Ein runtimeOnly auf eine Datei
// landet zwar im runtimeClasspath, aber nicht in der Liste, die ModDevGradle
// dem Client mitgibt — dort stehen nur aufgelöste Module. Für alles andere
// gibt es je Lauf eine eigene Konfiguration, und genau die ist hier gemeint.
dependencies {
    add(neoForge.runs.client.additionalRuntimeClasspathConfiguration.name,
            files(new File(ownRuntimeDir, 'jcef.jar')))
}

dependencies {
    // Jade nur zum Übersetzen und zum Ausprobieren — die Mod läuft ohne.
    // Die Anbindung ist so geschrieben, dass sie ohne Jade gar nicht erst
    // geladen wird.
    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"

    // GuideME trägt das Handbuch im Spiel. Der Inhalt ist Markdown, gerendert
    // wird er drinnen — deshalb steht die Spielerdoku dort und nicht als
    // Website daneben. Stammt von Applied Energistics, läuft aber ohne AE2.
    compileOnly "org.appliedenergistics:guideme:${guideme_version}:api"
    runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"

    // Mekanism trägt die Chemikalien. Ohne die Mod läuft alles wie bisher:
    // Was sie anfasst, liegt unter compat/mekanism und wird nur betreten,
    // wenn ModList sie meldet.
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    runtimeOnly "mekanism:Mekanism:${mekanism_version}"

    // Drei Mods nur fuer den Prüfstand, ohne compileOnly: An ihnen haengen
    // Risiken, die kein Test abdeckt.
    //
    // Sophisticated Storage: ein Behaelter mit vielen Faechern hinter einem
    // fremden getStackInSlot — genau die Decke, die die Messung in
    // speicherbus.md §7 ausdruecklich nicht kennt.
    //
    // Ars Nouveau: die Bloecke fuer click(), und Source als die
    // Ressourcenart, an der die offene Registry ihren Beweis bekommt.
    runtimeOnly "maven.modrinth:sophisticated-core:${sophisticated_core_version}"
    runtimeOnly "maven.modrinth:sophisticated-storage:${sophisticated_storage_version}"
    // Ars Nouveau auch zum Uebersetzen: Source ist eine Ressourcenart, und
    // ihr Zugriff steht in compat/ars gegen deren ISourceCap. Geladen werden
    // die Klassen erst, wenn FnArs.installed() wahr ist — dasselbe Muster wie
    // bei Mekanism.
    // Applied Energistics: ein ME-Netz als Quelle und Ziel (Punkt 7.7).
    // Zum Uebersetzen und zum Spielen — der Entwurf haengt an Fragen, die
    // nur das echte Jar beantwortet.
    compileOnly "maven.modrinth:ae2:${ae2_version}"
    runtimeOnly "maven.modrinth:ae2:${ae2_version}"
    compileOnly "maven.modrinth:ars-nouveau:${ars_nouveau_version}"
    runtimeOnly "maven.modrinth:ars-nouveau:${ars_nouveau_version}"
    // Ars Nouveau verlangt beide und bringt sie nicht mit.
    runtimeOnly "maven.modrinth:geckolib:${geckolib_version}"
    runtimeOnly "maven.modrinth:curios:${curios_version}"

    // <b>Chromium steckt nicht in diesem Jar und soll es nicht.</b> Die
    // Laufzeitumgebung wird gebaut, nicht bezogen — sie liegt neben dem
    // Quellbaum und wird getrennt ausgeliefert. Deshalb hier nur ein Verweis
    // auf das gebaute jcef.jar, niemals implementation und niemals ein
    // Shadow-Jar.
    //
    // <b>Der Abbruch ist Absicht.</b> Ohne den Bau fehlt org.cef vollständig,
    // und der Compiler meldete das als Dutzende fehlender Symbole. Eine Zeile,
    // die den Weg nennt, ist die bessere Meldung — auch wenn sie jeden
    // Gradle-Aufruf trifft, den clean eingeschlossen.
    if (!ownRuntimeDir.exists()) {
        throw new GradleException("Keine Laufzeitumgebung unter ${ownRuntimeDir}. "
                + "Erst: pwsh -File tools/runtime/build-jcef.ps1")
    }
    compileOnly files(new File(ownRuntimeDir, 'jcef.jar'))
    runtimeOnly files(new File(ownRuntimeDir, 'jcef.jar'))

    // JEI zeigt die Rezepte der Presse. Ohne die Mod fehlt nur die Anzeige:
    // Das Plugin wird von JEI selbst gefunden, und wer es nicht hat, lädt die
    // Klassen nie. Deshalb compileOnly auf die API und runtimeOnly auf die
    // ganze Mod — dieselbe Trennung wie bei Mekanism.
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"

    // JNA nur zum Übersetzen: Der ProcessGuard braucht drei Funktionen aus
    // kernel32, die JNAs eigenes Kernel32-Interface nicht kennt. Mitgeliefert
    // wird nichts — Minecraft bringt JNA über OSHI ohnehin mit, und eine
    // zweite Fassung im Klassenpfad wäre genau die Art Konflikt, die wir
    // gerade bei org.cef hinter uns haben.
    compileOnly 'net.java.dev.jna:jna:5.14.0'
    compileOnly 'net.java.dev.jna:jna-platform:5.14.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
    // Die Doku ist eine Eingabe: BeispieleTest übersetzt die Programme aus
    // docs/beispiele.md. Ohne diese Zeile hält Gradle den Test für aktuell,
    // solange sich nur die Doku geändert hat — und ein kaputtes Beispiel
    // bleibt unbemerkt stehen.
    inputs.files(fileTree('docs') { include '*.md' })
            .withPropertyName('doku')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

/**
 * Schiebt geänderte Texturen, Modelle und Sprachdateien ins laufende Spiel.
 *
 * Danach im Spiel F3+T drücken — Minecraft lädt die Ressourcen neu, ohne dass
 * jemand das Fenster schließen muss. Für Java-Code reicht das nicht; dafür
 * gibt es den Debugger-Anschluss auf Port 5005.
 */
tasks.register('syncResources') {
    group = 'factorynetwork'
    description = 'Ressourcen ins laufende Spiel schieben, dann im Spiel F3+T'
    dependsOn 'processResources'
    doLast {
        println 'Ressourcen aktualisiert — jetzt im Spiel F3+T druecken.'
    }
}

/**
 * Der Prueflauf der VS-Code-Erweiterung.
 *
 * Er stand bis zum 26.08. daneben und musste von Hand gestartet werden —
 * und niemand tat das zuverlaessig. Die Erweiterung fuehrt dieselben Regeln
 * wie der Editor im Spiel; zwei Fassungen derselben Regel laufen
 * auseinander, wenn niemand nachmisst.
 *
 * Ohne node wird uebersprungen statt gemeckert: Wer nur die Mod baut,
 * braucht keine Node-Installation.
 */
tasks.register('editorCheck', Exec) {
    description = 'Prueft die VS-Code-Erweiterung gegen dieselben Faelle wie den Editor im Spiel.'
    group = 'verification'
    workingDir = projectDir
    commandLine 'node', 'editor/vscode/check.js'
    onlyIf {
        try {
            def probe = new ProcessBuilder('node', '--version').start()
            probe.waitFor() == 0
        } catch (Exception ignored) {
            logger.lifecycle('node fehlt — der Prueflauf der Erweiterung wird uebersprungen.')
            false
        }
    }
}

tasks.named('test') {
    // GrammarKeywordTest liest die Grammatik der Erweiterung, und die liegt
    // ausserhalb der Quellordner. Ohne diese Zeile merkt Gradle eine Aenderung
    // daran nicht: Der Prueflauf gilt als aktuell, laeuft gar nicht erst, und
    // der Waechter schlaeft. Genau so ist er am 27.08. beim ersten Versuch
    // durchgerutscht — die Gegenprobe bestand, weil nichts lief.
    inputs.dir('editor/vscode').withPropertyName('editorSources')
    finalizedBy 'editorCheck'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    def expandProps = [
            mod_id     : mod_id,
            mod_name   : mod_name,
            mod_version: mod_version,
            mod_license: mod_license,
            mod_authors: mod_authors,
            neo_version: neo_version,
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
}
