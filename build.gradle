plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // Debugger-Anschluss für HotSwap, nur auf Anforderung:
            //   ./gradlew runClient -Pdebug
            //
            // Nicht dauerhaft an, weil ein hängengebliebener Prozess den Port
            // belegt und der nächste Start dann gar nicht erst hochkommt —
            // das ist ein schlechter Tausch für eine Möglichkeit, die man
            // selten braucht.
            if (project.hasProperty('debug')) {
                jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        // Führt die GameTests aus und beendet sich danach mit dem Ergebnis
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    // Jade wird über Modrinth bezogen; ein eigenes Maven hat es nicht.
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Jade nur zum Übersetzen und zum Ausprobieren — die Mod läuft ohne.
    // Die Anbindung ist so geschrieben, dass sie ohne Jade gar nicht erst
    // geladen wird.
    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
    // Die Doku ist eine Eingabe: BeispieleTest übersetzt die Programme aus
    // docs/beispiele.md. Ohne diese Zeile hält Gradle den Test für aktuell,
    // solange sich nur die Doku geändert hat — und ein kaputtes Beispiel
    // bleibt unbemerkt stehen.
    inputs.files(fileTree('docs') { include '*.md' })
            .withPropertyName('doku')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

/**
 * Schiebt geänderte Texturen, Modelle und Sprachdateien ins laufende Spiel.
 *
 * Danach im Spiel F3+T drücken — Minecraft lädt die Ressourcen neu, ohne dass
 * jemand das Fenster schließen muss. Für Java-Code reicht das nicht; dafür
 * gibt es den Debugger-Anschluss auf Port 5005.
 */
tasks.register('syncResources') {
    group = 'factorynetwork'
    description = 'Ressourcen ins laufende Spiel schieben, dann im Spiel F3+T'
    dependsOn 'processResources'
    doLast {
        println 'Ressourcen aktualisiert — jetzt im Spiel F3+T druecken.'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    def expandProps = [
            mod_id     : mod_id,
            mod_name   : mod_name,
            mod_version: mod_version,
            mod_license: mod_license,
            mod_authors: mod_authors,
            neo_version: neo_version,
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
}
