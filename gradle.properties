# Ars Nouveau liefert die beiden nicht mit; ohne sie startet es nicht.
#
# GeckoLib steht als Versions-ID und nicht als Nummer: Drei Ausgaben heissen
# 4.9.2 — fuer NeoForge, Forge und Fabric —, und das Modrinth-Maven sucht
# nach der Nummer. Es zog die falsche, und NeoForge meldete geckolib als
# fehlend, obwohl die Datei im Klassenpfad lag. tPkJmim6 ist die fuer
# NeoForge 1.21.1; die Nummer steht daneben, damit man sie lesen kann.
geckolib_version=tPkJmim6
geckolib_readable=4.9.2
curios_version=9.5.1+1.21.1

